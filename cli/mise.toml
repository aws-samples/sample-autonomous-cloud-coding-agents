min_version = "2026.7.11"

[tools]
node = "22"

[tasks.install]
description = "Install from monorepo root (Yarn workspaces)"
run = "cd .. && yarn install --check-files"

[tasks.compile]
description = "Compile TypeScript"
# The package script, not `yarn tsc`: a script runs this package's own TypeScript, while
# `yarn tsc` runs the root node_modules/.bin/tsc, which Yarn can link to another package's copy.
run = "yarn compile"

# The only type check that test/ gets: jest runs the tests through ts-jest with
# isolatedModules, which transpiles each file and checks no types, and `compile` covers
# src/. Without this task a type error in a test passes the whole build.
# tsconfig.dev.json is src and test under the same compiler options as tsconfig.json.
[tasks.typecheck]
description = "Type-check src and test (tsc --noEmit); jest does not check types"
run = "yarn typecheck"

[tasks.build]
description = "Compile, type-check, test, and lint CLI"
depends = [":compile", ":typecheck", ":test", ":eslint"]

[tasks.test]
description = "Run Jest tests"
# The package's test script (`jest --ci`), not a second jest command line: the coverage contract
# check reads scripts.test of package.json, so that has to be the command this task runs.
# --ci: a snapshot that is missing or differs fails the run instead of being written, on a
# developer machine as in CI. Do not add --updateSnapshot (rewrites a failing snapshot and
# passes) or --passWithNoTests (passes when no test file is left) to the script.
run = "yarn test"

[tasks.eslint]
description = "Run ESLint"
run = "../node_modules/.bin/eslint --fix --no-error-on-unmatched-pattern src test build-tools"
