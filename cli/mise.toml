min_version = "2026.7.11"

[tools]
node = "22.23.4"

[tasks.install]
description = "Install from monorepo root (Yarn workspaces)"
run = "cd .. && yarn install --check-files"

[tasks.compile]
description = "Compile TypeScript"
run = "yarn compile"

[tasks.typecheck]
description = "Type-check src and test (tsc --noEmit); jest does not check types"
wait_for = [":compile"]
run = "yarn typecheck"

[tasks.build]
description = "Compile, type-check, test, and lint CLI"
depends = [":compile", ":typecheck", ":test", ":eslint"]

[tasks.test]
description = "Run Jest tests"
run = "yarn test"

# ESLint looks for an eslint.config.* file from the directory of each file it lints;
# --config applies one file to every file.
[tasks.eslint]
description = "Run ESLint"
run = "../node_modules/.bin/eslint --config eslint.config.mjs --max-warnings 0 --fix src test"

[tasks."eslint:check"]
description = "Run ESLint without --fix: reports findings and rewrites nothing"
run = "../node_modules/.bin/eslint --config eslint.config.mjs --max-warnings 0 src test"
