[project]
name = "backgroundagent"
version = "0.1.0"
description = "Background coding agent — runs tasks in isolated cloud environments and produces pull requests"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.44.0",
    "bedrock-agentcore==1.26.0",
    # Held at 0.2.179: 0.2.180 bundles claude CLI 2.1.321, whose changelog says: "Changed
    # mods Claude writes to turn on without asking in auto and bypass modes".
    # 0.2.179 bundles claude CLI 2.1.319, kept in lockstep with the npm CLI pin in the
    # Dockerfile (#215).
    "claude-agent-sdk==0.2.179",
    "requests==2.34.2",
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "aws-opentelemetry-distro==0.22.0",
    "mcp==2.3.0",
    # The binding version is not the Cedar core version: cedarpy 4.12.2 builds on cedar-policy
    # 4.12.0, the same core as @cedar-policy/cedar-wasm 4.12.0 pinned in cdk/package.json.
    "cedarpy==4.12.2",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

# nosemgrep: uv-missing-dependency-cooldown -- deps are exact-pinned and lock-reviewed; a global cooldown makes `uv sync` unsatisfiable on fresh pins (#532)
[tool.uv]
constraint-dependencies = [
    "pyjwt>=2.13.0",  # PYSEC-2026-175/177/178/179 — transitive via mcp, which still accepts pyjwt>=2.10.1 in 2.3.0 (#267)
]

# At min_confidence 80 vulture reports only what it is sure of: unreachable code
# (after return or raise, a condition that cannot hold) and imports and function
# arguments that nothing reads (it calls such an argument an "unused variable").
# It rates an unused function, class, method or variable 60, so those are NOT
# reported at this threshold.
[tool.vulture]
paths = ["src", ".vulture_allowlist.py"]
min_confidence = 80

[tool.bandit]
exclude_dirs = ["tests", ".venv"]


[dependency-groups]
dev = [
    "bandit==1.9.4",
    "ruff==0.17.4",
    "ty==0.0.100",
    "pytest==9.2.0",
    "pygments==2.21.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "vulture==2.16",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# The vulture allowlist is bare-name expressions: ruff would flag every line F821/B018.
extend-exclude = [".vulture_allowlist.py"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "ARG",
    "I",
    "B",
    "S",
    "UP",
    "SIM",
    "TCH",
    "RUF",
    "ASYNC",
    "C4",
    "EXE",
    "FURB",
    "PERF",
    "RET",
    "PLR2004",
    "A",
    "DTZ",
    "FAST",
    "FLY",
    "G",
    "INT",
    "ISC",
    "LOG",
    "PGH",
    "PIE",
    "PLE",
    "RSE",
    "T10",
    "YTT",
    "C90",
    "TID",
]
ignore = [
    "S603",
    "S607",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests_emulator/**" = ["S101", "PLR2004", "ARG", "TID251"]
"src/entrypoint.py" = ["E402"]
# TID251 is one rule for the whole banned-api table below, so this file-wide exemption
# also switches off the ban on importing `server` and `entrypoint` in that file.
"src/aws_session.py" = ["TID251"]
"src/prompts/*.py" = ["E501"]
"tests/**" = ["S101", "S106", "S108", "PLR2004", "ARG", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"boto3.client".msg = "un-attributed AWS client (#319): use aws_session.tenant_client() for tenant data or aws_session.platform_client() for platform calls"
"boto3.resource".msg = "un-attributed AWS resource (#319): use aws_session.tenant_resource()"
"boto3.Session".msg = "sessions are built only in src/aws_session.py (#319): use aws_session.tenant_client(), tenant_resource() or platform_client()"
"boto3.session".msg = "sessions are built only in src/aws_session.py (#319): use aws_session.tenant_client(), tenant_resource() or platform_client()"
"boto3.DEFAULT_SESSION".msg = "the default session is un-attributed (#319): use aws_session.tenant_client(), tenant_resource() or platform_client()"
"boto3.setup_default_session".msg = "the default session is un-attributed (#319): use aws_session.tenant_client(), tenant_resource() or platform_client()"
"botocore.session".msg = "a botocore session builds un-attributed clients (#319): use aws_session.tenant_client(), tenant_resource() or platform_client()"
"server".msg = "server.py is a process entrypoint (uvicorn loads it): move what you need into a module both can import"
"entrypoint".msg = "entrypoint.py is the batch entrypoint and a re-export shim kept for tests, and importing it reloads config: import the name from the module that defines it"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
strict = true
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = [
    "error",
]
addopts = "-ra"
console_output_style = "count"
timeout = 120
# pytest-timeout's thread method dumped the stack but did not end a syscall-blocked test
# (observed, ABCA-688). The signal method (SIGALRM) interrupts it in the main thread.
timeout_method = "signal"
# SIGALRM fires only in the main thread, so it does not end a hang in a worker thread.
# faulthandler's C watchdog thread, immune to the GIL and blocked syscalls, dumps every stack.
faulthandler_timeout = 300

[tool.coverage.run]
branch = true
source = ["src"]
relative_files = true

[tool.coverage.report]
fail_under = 89
precision = 2
show_missing = true
skip_covered = true
# These two lists replace coverage.py's defaults, which honour the `pragma: no cover` and
# `pragma: no branch` comments.
exclude_lines = ["^ *if TYPE_CHECKING:$", "^ *[.][.][.]$"]
partial_branches = []

[tool.ty.environment]
python-version = "3.13"
extra-paths = ["src"]

[tool.ty.src]
# The vulture allowlist is bare-name expressions: ty flags each line unresolved-reference.
exclude = [".vulture_allowlist.py"]
