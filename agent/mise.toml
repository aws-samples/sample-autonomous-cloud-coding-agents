min_version = "2026.7.11"

[tools]
python = "3.13"
uv = "0.13.7"
"aqua:aquasecurity/trivy" = "v0.76.2"

[env]
_.python.venv = { path = ".venv", create = true }
PROJECT_NAME = "{{ config_root | basename }}"

[tasks]
install = "uv sync --locked --all-groups"

[tasks.upgrade]
description = "Refresh uv.lock within the pins declared in pyproject.toml (exact pins, incl. cedarpy, are not rewritten)"
run = "uv lock --upgrade"

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
'''

# Left to discover configuration per directory, ruff would let a ruff.toml or
# [tool.ruff] added below agent/ replace the rules, the ignores and the banned-api
# table for that directory. --config applies agent/pyproject.toml to every file.
# A plain `ruff check` or `ruff format` by hand does discover such a file, and ruff's cache
# then hands the results it stored for the files beside it to the tasks (observed): --no-cache.
#
# A plain `uv run` re-locks when pyproject.toml is ahead of uv.lock: the check would
# rewrite the lockfile and still pass. With --locked it fails instead.

[tasks.lint]
description = "Lint with ruff"
run = "uv run --locked ruff check --config pyproject.toml --no-cache"

[tasks."lint:fix"]
description = "Lint and auto-fix. Fails when it changed a file (the fixes are listed): look at the change, keep it, run again."
run = "uv run ruff check --config pyproject.toml --no-cache --fix --show-fixes --exit-non-zero-on-fix"

[tasks.format]
description = "Format with ruff. Fails when it rewrote a file: look at the change, keep it, run again."
run = "uv run ruff format --config pyproject.toml --no-cache --exit-non-zero-on-format"

[tasks."format:check"]
description = "Check formatting"
run = "uv run --locked ruff format --config pyproject.toml --no-cache --check"

[tasks.typecheck]
description = "Type check with ty"
run = "uv run --locked ty check"

[tasks."lint:deadcode"]
description = "Dead code with vulture at min_confidence 80 (#282, cairn MVG gate #6): unreachable code, and imports and function arguments it is sure are unused. Unused functions, classes, methods and variables are rated 60 and are NOT reported. Settings in pyproject.toml, intentional keeps in .vulture_allowlist.py."
run = "uv run --locked vulture"

# Without --cov-config coverage.py reads the file a COVERAGE_RCFILE variable names, when
# one is set, and that file's source and omit lists would decide what the floor measures.
[tasks.test]
description = "Run tests with pytest (coverage floor enforced; use `uv run pytest --no-cov` for focused runs)"
run = "uv run pytest --junit-xml=test-reports/junit.xml --cov=src --cov-config=pyproject.toml --cov-branch --cov-fail-under=89 --cov-report=term-missing:skip-covered --cov-report=lcov:coverage/lcov.info --cov-report=json:coverage/coverage.json"

[tasks."security:bandit"]
description = "Run Bandit"
run = "uv run bandit -c pyproject.toml -r . --severity-level=high"

[tasks."security:image"]
description = "Scan container image with trivy"
run = [
  "ARCH=\"$(uname -m)\"; PLATFORM=\"linux/arm64\"; if [ \"$ARCH\" = \"x86_64\" ]; then PLATFORM=\"linux/amd64\"; fi; docker build --build-arg TARGETPLATFORM=\"$PLATFORM\" --build-arg CACHE_BUST=\"$(date +%s)\" -f Dockerfile -t bgagent-local:latest ..",
  "trivy image --scanners vuln --ignore-unfixed --ignorefile .trivyignore --severity HIGH,CRITICAL --exit-code 1 bgagent-local:latest",
]

[tasks.quality]
description = "Run quality checks"
run = [
    { task = "lint:fix" },
    { task = "format" },
    { task = "typecheck" },
    { task = "lint:deadcode" },
    { task = "test" },
]

[tasks.security]
description = "Run security scans"
run = [
    { task = "security:bandit" },
    { task = "security:image" },
]

[tasks."local:up"]
description = "Start DynamoDB Local and create tables for local agent testing"
run = [
  "docker compose up -d",
  "bash scripts/create-local-tables.sh",
]

[tasks."local:down"]
description = "Stop DynamoDB Local (all data is ephemeral)"
run = "docker compose down"

# The two scans switch the pager of AWS CLI v2 off with an empty AWS_PAGER, not with
# --no-cli-pager: AWS CLI v1 rejects that flag.

[tasks."local:events"]
description = "Query progress events from DynamoDB Local"
run = """
AWS_PAGER='' aws dynamodb scan \
  --table-name TaskEventsTable \
  --endpoint-url http://localhost:8000 \
  --region us-east-1 \
  --output table 2>/dev/null || echo "No events found (is DynamoDB Local running?)"
"""

[tasks."local:events:json"]
description = "Query progress events from DynamoDB Local (JSON)"
run = """
AWS_PAGER='' aws dynamodb scan \
  --table-name TaskEventsTable \
  --endpoint-url http://localhost:8000 \
  --region us-east-1 \
  --output json 2>/dev/null || echo "{}"
"""
