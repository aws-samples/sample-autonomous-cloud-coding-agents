min_version = "2026.7.11"

[tools]
node = "22"

[tasks.install]
description = "Install from monorepo root (Yarn workspaces)"
run = "cd .. && yarn install --check-files"

[tasks.sync]
description = "Generate the Starlight mirrors from docs/guides, docs/design, docs/decisions and CONTRIBUTING.md"
run = "node scripts/sync-starlight.mjs"

[tasks.test]
# The files are named, not globbed: a glob that matches nothing would pass.
description = "Tests for the mirror generator and for the Markdown structure lint (scripts/*.test.mjs)"
run = "node --test scripts/sync-starlight.test.mjs scripts/markdown-lint.test.mjs"

[tasks.build]
# astro check (type errors in .astro components and config) runs first, in this task, so
# that the required build gets it without building the site a second time.
description = "Starlight docs site build: Markdown structure lint, astro check, then astro build (which validates internal links)"
depends = [":sync", ":test", ":markdown-lint"]
run = ["./node_modules/.bin/astro check", "./node_modules/.bin/astro build"]

[tasks.dev]
description = "Starlight dev server"
run = "./node_modules/.bin/astro dev"

[tasks.check]
description = "astro check"
depends = [":sync"]
run = "./node_modules/.bin/astro sync && ./node_modules/.bin/astro check"

[tasks.link-check]
# Scope: every Markdown file in the repository that git tracks, and every new one that is
# not ignored.
# Not scanned: the generated mirrors in src/content/docs (astro build validates those).
description = "Check for broken relative links in all Markdown sources"
run = "bash scripts/link-check.sh"

[tasks.markdown-lint]
# Scope: every Markdown file in the repository that git tracks, with the five structural
# rules set in scripts/markdown-lint.mjs. A dependency of :build, so the required build
# runs it.
# Not linted: the generated mirrors in src/content/docs (their sources are).
description = "Lint the structure of all Markdown sources: tables, headings, image alt text"
run = "yarn -s markdown-lint"
