min_version = "2026.7.11"

[tools]
node = "22"

[tasks.install]
description = "Install from monorepo root (Yarn workspaces)"
run = "cd .. && yarn install --check-files"

[tasks.sync]
description = "Sync docs content from guides/design/CONTRIBUTING"
run = "node scripts/sync-starlight.mjs"

[tasks.test]
# The file is named, not globbed: a glob that matches nothing would pass.
description = "Tests for the mirror generator (scripts/sync-starlight.mjs)"
run = "node --test scripts/sync-starlight.test.mjs"

[tasks.build]
description = "Starlight docs site build"
depends = [":sync", ":test"]
run = "./node_modules/.bin/astro build"

[tasks.dev]
description = "Starlight dev server"
run = "./node_modules/.bin/astro dev"

[tasks.check]
description = "astro check"
depends = [":sync"]
run = "./node_modules/.bin/astro sync && ./node_modules/.bin/astro check"

[tasks.link-check]
# Scope: docs/guides/, docs/design/, docs/decisions/, and root *.md files.
# Not scanned: docs/README.md, agent/, cli/, contracts/, docs/abca-plugin/.
description = "Check for broken links in Markdown sources"
run = "bash scripts/link-check.sh"
