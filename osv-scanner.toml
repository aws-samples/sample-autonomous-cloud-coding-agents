# Advisories accepted temporarily for yarn.lock. osv-scanner reads this file for
# lockfiles in this directory. Each entry expires so the scan fails again and the
# finding is re-reviewed; remove an entry as soon as a fixed release is available.

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-12-16
reason = "minimatch globparts DoS (7.0.0 and later, fixed in 11.0.1). Two affected copies are left, both in build tooling and never deployed. 10.2.5 is bundled inside aws-cdk-lib 2.261.0 (bundleDependencies, which resolutions cannot replace) and matches only patterns from CDK code and the cdk command line, at synth time. On 2026-11-16 no aws-cdk-lib release had the fix: 2.277.0 bundles 10.2.6, and the bump to 11.0.8 (aws/aws-cdk#39595, merged 2026-11-13) is not in it. 10.2.6 serves eslint-plugin-import-x 4.17.1 (lint only, patterns from the eslint configs), which imports makeRe, removed in minimatch 11. 4.18.0, the first release that accepts minimatch 11, also sorts parent imports before sibling imports in import-x/order, which fails lint on existing files; that bump is left to the dependency update that re-sorts them."
