effectiveUntil = 2026-12-16
reason = "picomatch regular-expression denial of service on a crafted glob pattern (every release through 4.0.7; reviewed by GitHub on 2026-11-17, and on 2026-11-18 no fixed release exists). Both locked copies, 2.3.2 and 4.0.7, belong to build and test tooling only (jest, vitest, vite, astro, knip, the ESLint stylistic plugin) and are never deployed. They match only patterns from this repository's own configuration, never a pattern from a request."
