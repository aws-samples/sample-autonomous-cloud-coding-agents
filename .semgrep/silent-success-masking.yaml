# Custom semgrep rules: silent-success masking (AI004 / CA-09, issue #257).
#
# Detects catch/except blocks that swallow a failure and return a
# plausible-but-empty default ([] / {} / null / undefined / None / "" ...)
# instead of surfacing the error. Bare-except and empty-catch are covered by
# existing gates (ruff E722/B, eslint); this targets the more dangerous
# variant where the caller sees a "successful" empty result and cannot tell
# it apart from a real one.
#
# Allowlist mechanism: intentional degraded-mode fallbacks get an inline
#   // nosemgrep: <rule-id> -- <justification>     (TS)
#   # nosemgrep: <rule-id> -- <justification>      (Py)
# on the flagged return line (repo convention; precedent in
# scripts/check-types-sync.ts and agent/src/config.py).
#
# PLACEMENT FOOTGUN: `focus-metavariable: $RET` anchors the finding on the
# `return` statement, so the `nosemgrep` TOKEN must sit on that return line or
# the line IMMEDIATELY above it — that is the only span semgrep scans for a
# suppression. A multi-line justification whose FIRST line carries the token
# and whose continuation line then abuts the return does NOT bind (the abutting
# line lacks the token). Put the prose above and the `# nosemgrep: ...` line
# last, directly over the return.
#
# CLASSIFY-THEN-RETHROW EXEMPTION (the `pattern-not` on each rule): a catch that
# returns an empty default and THEN rethrows on the fallthrough
# (`catch (e) { if (isNotFound(e)) return undefined; throw e; }`) is not masking —
# the classified empty is a genuine success and every other error still reaches
# the caller. The return-before-throw ORDER is what distinguishes it from the
# `maskedConditionalRethrow` / `masked_conditional_reraise` fixtures (throw
# guarded FIRST, then an unconditional masking return), which stay flagged.
# Trade-off (deliberate): this also exempts the genuinely-ambiguous
# `catch (e) { if (benign(e)) return null; throw e; }`, where the benign branch
# does mask. We accept that — a per-site `nosemgrep` cannot express ordering and
# would train contributors to annotate correctness away (#730), and the shape is
# rare; flag such a site in review instead. Callback returns (below) are the
# other known gap.
#
# Known limitation: a `return null`/`return []` inside a callback *defined
# within* a catch block (e.g. `.map(i => ... return null ...)`) is flagged
# even though it does not mask the outer failure. Rare in practice; use the
# nosemgrep allowlist if it occurs.
#
# Run:  mise run security:sast:masking        (blocking; emits SARIF)
# Test: semgrep test .semgrep/
rules:
  - id: ts-silent-success-masking
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      category: correctness
      confidence: MEDIUM
      abca-finding: AI004
      references:
        - https://github.com/aws-samples/sample-autonomous-cloud-coding-agents/issues/257
    message: >-
      This catch block swallows the error and returns an empty default, so
      the caller cannot distinguish failure from a genuinely empty result
      (silent-success masking, AI004). Fix: re-throw (`throw err;`), throw a
      typed error that adds context, or return a result shape that encodes
      the failure. Logging alone is not enough — the failure must reach the
      caller. If this fallback is intentional degraded-mode behavior, keep it
      and add on the return line
      "// nosemgrep: ts-silent-success-masking -- <why callers may safely
      treat this failure as an empty success>".
    patterns:
      - pattern-either:
          - pattern: |
              try { ... } catch ($E) { ... return $RET; ... }
          - pattern: |
              try { ... } catch { ... return $RET; ... }
          - pattern: |
              try { ... } catch ($E) { ... return $RET; ... } finally { ... }
          - pattern: |
              try { ... } catch { ... return $RET; ... } finally { ... }
      # Classify-then-rethrow is NOT masking: a classified return that is
      # followed by a throw on the catch's fallthrough surfaces every other
      # error, so the caller can still distinguish failure from empty success.
      # The order is load-bearing — it is exactly what separates this shape
      # from the `maskedConditionalRethrow` fixture (throw guarded FIRST, then
      # an unconditional masking return), which stays flagged.
      - pattern-not: |
          try { ... } catch ($E) { ... return $RET; ... throw $ERR; }
      - metavariable-regex:
          metavariable: $RET
          regex: ^(null|undefined|\[\s*\]|\{\s*\}|""|''|``)$
      - focus-metavariable: $RET

  - id: py-silent-success-masking
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      confidence: MEDIUM
      abca-finding: AI004
      references:
        - https://github.com/aws-samples/sample-autonomous-cloud-coding-agents/issues/257
    message: >-
      This except block swallows the error and returns an empty default, so
      the caller cannot distinguish failure from a genuinely empty result
      (silent-success masking, AI004). Fix: re-raise (`raise`), raise a typed
      error that adds context (`raise XError(...) from exc`), or return a
      result shape that encodes the failure. Logging alone is not enough —
      the failure must reach the caller. If this fallback is intentional
      degraded-mode behavior, keep it and add on the return line
      "# nosemgrep: py-silent-success-masking -- <why callers may safely
      treat this failure as an empty success>".
    patterns:
      - pattern-either:
          - pattern: |
              try:
                ...
              except $EXC:
                ...
                return $RET
          - pattern: |
              try:
                ...
              except $EXC as $E:
                ...
                return $RET
          - pattern: |
              try:
                ...
              except:
                ...
                return $RET
          - pattern: |
              try:
                ...
              except $EXC:
                ...
                return $RET
              finally:
                ...
          - pattern: |
              try:
                ...
              except $EXC as $E:
                ...
                return $RET
              finally:
                ...
          - pattern: |
              try:
                ...
              except:
                ...
                return $RET
              finally:
                ...
      # Classify-then-reraise is NOT masking (see the TS twin above): a
      # classified return followed by a `raise` on the fallthrough surfaces
      # every other error. The order distinguishes it from
      # masked_conditional_reraise (raise guarded FIRST, then a masking return).
      - pattern-not: |
          try:
            ...
          except $EXC as $E:
            ...
            return $RET
            ...
            raise
      - pattern-not: |
          try:
            ...
          except $EXC as $E:
            ...
            return $RET
            ...
            raise $ERR
      - metavariable-regex:
          metavariable: $RET
          regex: ^(None|\[\s*\]|\{\s*\}|""|''|\(\s*\)|set\(\s*\)|dict\(\s*\)|list\(\s*\)|tuple\(\s*\))$
      - focus-metavariable: $RET
