name: Security

on:
  workflow_dispatch: {}
  schedule:
    # Weekly: Monday 12:00 UTC
    - cron: "0 12 * * 1"

concurrency:
  group: security-suite
  cancel-in-progress: false

permissions:
  actions: none
  attestations: none
  checks: none
  contents: none
  deployments: none
  discussions: none
  id-token: none
  issues: none
  models: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  security:
    name: Monorepo security suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      CI: "true"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.10.25 # exact mise release for every workflow (#890); bump by PR
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Install dependencies
        run: mise run install

      - name: Run security suite
        id: scan
        run: |
          set -o pipefail
          # --continue-on-error: every scanner runs even when an earlier one
          # failed, and the command still exits non-zero when any of them did.
          mise run --continue-on-error security 2>&1 | tee security-log.txt
        continue-on-error: true

      # A scan ignore stops applying on its expiry date. From that day the
      # finding is reported again: for an osv-scanner.toml entry the required
      # dependency scan (security-pr.yml) fails on every pull request, for a
      # .trivyignore entry the image scan fails in this suite and in the
      # pre-push hook. Warn 21 days ahead. A date that cannot be read is
      # reported too, and so is an osv-scanner expiry written in a form this
      # line reader does not follow. ignore-expiry.md is empty when there is
      # nothing to warn about. cdk/test/scripts/security-workflow.test.ts runs
      # this step and the report below with bash.
      - name: Warn about scan ignores that expire within 21 days
        id: expiry
        run: |
          set -euo pipefail
          node - > ignore-expiry.md <<'EOF'
          const { execFileSync } = require('node:child_process');
          const { readFileSync } = require('node:fs');
          const today = Date.parse(new Date().toISOString().slice(0, 10));
          const tracked = (name) => execFileSync('git', ['ls-files', '--', name, `*/${name}`], { encoding: 'utf8' }).split('\n').filter(Boolean);
          const warnings = [];
          const warn = (file, index, id, value) => {
            const date = value.match(/\d{4}-\d{2}-\d{2}/)?.[0];
            const days = Math.round((Date.parse(date) - today) / 86400000);
            if (days > 21) return;
            const state = Number.isNaN(days) ? 'date not readable' : days <= 0 ? 'expired' : `${days} day(s) left`;
            warnings.push(`- \`${file}:${index + 1}\` ${id || 'entry'}: ignored until ${date ?? value.trim()} (${state})`);
          };
          for (const file of tracked('osv-scanner.toml')) {
            let id = '';
            // osv-scanner accepts CRLF line endings and any capitalisation of a
            // key (IgnoreUntil), so both are read here.
            readFileSync(file, 'utf8').split(/\r?\n/).forEach((line, index) => {
              if (line.startsWith('[[')) id = '';
              id = line.match(/^\s*id\s*=\s*"([^"]+)"/i)?.[1] ?? id;
              const value = line.match(/^\s*(?:ignoreUntil|effectiveUntil)\s*=\s*(.*)$/i)?.[1];
              if (value === undefined) {
                // A quoted key or an inline table is valid TOML too. Say that
                // the line was not read instead of skipping it.
                if (/^(?!\s*#).*(?:ignoreUntil|effectiveUntil)["']?\s*=/i.test(line)) {
                  warnings.push(`- \`${file}:${index + 1}\` entry: expiry not readable in this form; write it as \`ignoreUntil = YYYY-MM-DD\` on a line of its own`);
                }
                return;
              }
              warn(file, index, id, value);
            });
          }
          // trivy trims a line and splits it at white space: the first word is
          // the id, and the first later word that starts with `exp:`, in lower
          // case, holds the expiry date, even after a `#`. A line that starts
          // with `#` is a comment.
          for (const file of tracked('.trivyignore')) {
            readFileSync(file, 'utf8').split('\n').forEach((line, index) => {
              const [id, ...words] = line.trim().split(/\s+/);
              const expiry = id.startsWith('#') ? undefined : words.find((word) => word.startsWith('exp:'));
              if (expiry !== undefined) warn(file, index, id, expiry.slice(4));
            });
          }
          if (warnings.length > 0) {
            console.log('### Scan ignores that expire within 21 days\n');
            console.log(warnings.join('\n'));
            console.log('\nFrom the date shown the finding is reported again: for an `osv-scanner.toml` entry the required dependency scan then fails on every pull request, for a `.trivyignore` entry the image scan fails in the weekly suite and in the pre-push hook. Fix the dependency, or renew the ignore with a reason that is still true, before that date.');
          }
          EOF
          if [ -s ignore-expiry.md ]; then
            tee -a "$GITHUB_STEP_SUMMARY" < ignore-expiry.md
          else
            echo "No scan ignore expires within 21 days."
          fi

      # One rolling issue instead of a new issue per failing run: comment on the
      # open issue that has this exact title, or create it. `!cancelled()` so a
      # failure of the step above cannot suppress the report of a failed suite.
      # That failure is reported as well: when the expiry check did not finish,
      # a run that looks clean says nothing about ignores that are about to expire.
      # Only an issue that this workflow opened is reused: the lookup asks for
      # `author:app/github-actions`, the account that GITHUB_TOKEN writes as. An
      # issue with the same title from anyone else is ignored and a new one is
      # created. Change the qualifier if this step ever writes with another token.
      - name: Report to the rolling issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          EXPIRY_OUTCOME: ${{ steps.expiry.outcome }}
        run: |
          set -euo pipefail
          if [ "${SCAN_OUTCOME}" = "success" ] && [ "${EXPIRY_OUTCOME}" = "success" ] && [ ! -s ignore-expiry.md ]; then
            echo "Suite passed and no ignore expires within 21 days: nothing to report."
            exit 0
          fi
          title="Security suite needs attention"
          body_file="$(mktemp)"
          {
            echo "The security suite (\`mise run --continue-on-error security\`) needs attention: suite outcome **${SCAN_OUTCOME}**. This is a rolling issue: every run that fails or finds an ignore close to expiry comments here instead of opening a new issue."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Workflow run | [Security #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| SHA | [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Actor | @${GITHUB_ACTOR} |"
            echo "| Event | \`${GITHUB_EVENT_NAME}\` |"
            if [ "${EXPIRY_OUTCOME}" != "success" ]; then
              echo ""
              echo "**The check for scan ignores close to expiry did not finish (step outcome: ${EXPIRY_OUTCOME}).** This run says nothing about ignores that are about to expire. The step \"Warn about scan ignores that expire within 21 days\" in the workflow run shows why."
            fi
            if [ -s ignore-expiry.md ]; then
              echo ""
              cat ignore-expiry.md
            fi
            if [ "${SCAN_OUTCOME}" != "success" ]; then
              echo ""
              echo "### Failed scanners"
              echo ""
              echo '```text'
              grep 'exited with status' security-log.txt || echo "(none listed: see the log tail and the workflow run)"
              echo '```'
              echo ""
              echo "### Log tail (last 200 lines)"
              echo ""
              echo '```text'
              tail -n 200 security-log.txt || true
              echo '```'
            fi
            echo ""
            echo "Close this issue after \`mise run security\` succeeds on \`${GITHUB_REF_NAME}\` and no ignore is within 21 days of expiry."
          } > "${body_file}"

          number="$(gh issue list --state open --search "in:title \"${title}\" author:app/github-actions" --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body-file "${body_file}"
          else
            gh issue create --title "${title}" --label bug --body-file "${body_file}"
          fi

      - name: Fail job if security suite failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
