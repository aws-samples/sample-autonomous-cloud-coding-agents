name: security-pr
# Required-on-PR security gate (issue #327). Catches the incident class
# (#313: secrets reaching history because the scan only ran weekly) at PR time.
#
# One step per check; the name and comment of each step say what it covers and
# how it is scoped. The job is a required status check and runs on every pull
# request and merge-queue entry, so checks here must stay quick; the one slow
# step, the agent image build, runs only when the image inputs change. The
# slower sweeps (full registry SAST, grype, retire, bandit, the trivy image
# scan and the full-history secret sweep) run weekly in security.yml and are
# tracked by #235.
on:
  pull_request: {}
  # Must also run on merge_group so this check reports inside the merge queue;
  # otherwise marking it a required check deadlocks the queue. See #327.
  merge_group: {}
  workflow_dispatch: {}

# Least privilege: read the code, nothing else.
permissions:
  contents: read

concurrency:
  group: security-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets-deps-actions:
    name: Secrets, deps, and workflow scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
      MISE_EXPERIMENTAL: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the range scan can resolve the base ref. A shallow
          # clone would leave origin/<base> unresolvable for the commit-range diff.
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - name: Resolve commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # `range` is the gitleaks A..B commit range; `baseline` is the single
          # commit semgrep diffs against (--baseline-commit reports only findings
          # ADDED since it). Both derive from the same base SHA.
          case "$EVENT_NAME" in
            pull_request)
              # Scan exactly the commits this PR introduces.
              range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              baseline="${PR_BASE_SHA}"
              head="${PR_HEAD_SHA}"
              ;;
            merge_group)
              # Scan only the queued merge commits — not full history. An empty
              # range would walk every ref and fail on secrets on other branches
              # (#334 merge-queue ejection).
              range="${MG_BASE_SHA}..${MG_HEAD_SHA}"
              baseline="${MG_BASE_SHA}"
              head="${MG_HEAD_SHA}"
              ;;
            workflow_dispatch|*)
              # Manual dispatch: scan HEAD only (safe default, not full history).
              # baseline=HEAD reports only uncommitted findings (none in CI), so
              # the two ratchets and the image build do nothing here — the full
              # registry scan lives in security.yml.
              range="HEAD"
              baseline="HEAD"
              head="HEAD"
              ;;
          esac
          # Both ends of the range must be commits in this checkout. gitleaks
          # scans nothing and still exits 0 when it cannot resolve the range, so
          # with an empty or unknown SHA the secret scan would pass unscanned.
          # `^{commit}` makes git look the object up: a bare 40-character name
          # is accepted without that.
          for commit in "${baseline}" "${head}"; do
            if ! git rev-parse --verify --quiet "${commit}^{commit}" > /dev/null; then
              echo "::error::Cannot resolve '${commit}' to a commit in this checkout (event ${EVENT_NAME}, range '${range}'), so nothing can be scanned. Re-run the job; if it fails again, check that the checkout step fetched the full history."
              exit 1
            fi
          done
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "Resolved GITLEAKS_RANGE='${range}'"
          echo "Resolved SEMGREP_MASKING_BASELINE='${baseline}'"

      # Every scanner step carries `if: ${{ !cancelled() }}`, so one failing
      # scanner does not hide the others. Without it a step runs only while every
      # earlier step succeeded (the implicit `success()`). A failed step still
      # fails the job. Put the same condition on every scanner step added here.
      - name: Secret scan (gitleaks, range-scoped)
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_RANGE: ${{ steps.range.outputs.range }}
        run: mise run security:secrets:range

      # This step is part of the "Secrets, deps, and workflow scan" job, which is
      # a required status check on main (repo ruleset), bound by job NAME: do not
      # rename the job or remove this step. Pull request and merge-queue runs
      # both execute this file as it is in the commit under test, so a pull
      # request can edit it. What stops a step from being removed is the admin
      # code-owner review that .github/CODEOWNERS requires for .github/.
      - name: Silent-success masking scan (semgrep, ratcheted to new findings)
        if: ${{ !cancelled() }}
        env:
          SEMGREP_MASKING_BASELINE: ${{ steps.range.outputs.baseline }}
        run: mise run security:sast:masking:range

      # The same rule over the whole tree: any unsuppressed finding fails, not
      # only one this pull request adds, so a finding cannot reach main and wait
      # there for the weekly run. main has been clean since #909.
      - name: Silent-success masking scan (semgrep, full repository)
        if: ${{ !cancelled() }}
        run: mise run security:sast:masking

      # The registry rule packs of security:sast, scoped with --baseline-commit
      # to the findings this pull request adds; the full scan stays weekly. The
      # packs are downloaded from semgrep.dev at run time, so this required job
      # needs the registry: when it is unreachable the step fails, it never
      # passes without rules.
      - name: SAST (semgrep registry packs, ratcheted to new findings)
        if: ${{ !cancelled() }}
        env:
          SEMGREP_SAST_BASELINE: ${{ steps.range.outputs.baseline }}
        run: mise run security:sast:range

      - name: Dependency scan (osv-scanner)
        if: ${{ !cancelled() }}
        run: mise run security:deps

      - name: Workflow static analysis (zizmor)
        if: ${{ !cancelled() }}
        run: mise run security:gh-actions

      # Nothing else builds the agent image before merge (deploy and integ build
      # it afterwards), so a broken Dockerfile or lockfile used to pass every
      # check (#235). Build it here when a file that defines the image differs
      # between the base commit and this checkout. The decision is made inside
      # the step, never with a workflow `paths` filter: a required check that
      # does not run stays pending and blocks the merge. The command mirrors
      # `security:image` in agent/mise.toml (linux/amd64 on this runner); the
      # trivy scan of the image stays weekly.
      - name: Build agent image when its inputs changed
        if: ${{ !cancelled() }}
        env:
          IMAGE_BASELINE: ${{ steps.range.outputs.baseline }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${IMAGE_BASELINE}" HEAD -- agent/Dockerfile agent/pyproject.toml agent/uv.lock .dockerignore)"
          if [ -z "${changed}" ]; then
            echo "No agent image input changed since ${IMAGE_BASELINE}: skipping the image build."
            exit 0
          fi
          echo "Agent image inputs changed since ${IMAGE_BASELINE}:"
          echo "${changed}"
          ARCH="$(uname -m)"; PLATFORM="linux/arm64"; if [ "$ARCH" = "x86_64" ]; then PLATFORM="linux/amd64"; fi
          docker build --build-arg TARGETPLATFORM="$PLATFORM" --build-arg CACHE_BUST="$(date +%s)" -f agent/Dockerfile -t bgagent-local:latest .
