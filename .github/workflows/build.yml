name: build
on:
  pull_request: {}
  # A required check must run on `merge_group`, or the merge queue deadlocks (#327).
  merge_group: {}
  workflow_dispatch: {}
permissions:
  actions: none
  attestations: none
  checks: none
  contents: none
  deployments: none
  discussions: none
  id-token: none
  issues: none
  models: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    permissions:
      contents: read
    # The job default is 360 minutes; the merge queue gives up on an entry after 60.
    timeout-minutes: 45
    runs-on: >-
      ${{
        vars.DEFAULT_RUNNER_LABEL
        || (github.event_name == 'pull_request'
            && contains(github.event.pull_request.labels.*.name, 'self-hosted')
            && 'self-hosted')
        || (github.event_name == 'pull_request'
            && contains(github.event.pull_request.labels.*.name, 'ubuntu-latest-4-cores')
            && 'ubuntu-latest-4-cores')
        || 'ubuntu-latest'
      }}
    # The ruleset of `main` requires the check named `build (agentcore)`: the one-value matrix
    # gives the job that name.
    strategy:
      matrix:
        compute_type: [agentcore]
    outputs:
      self_mutation_happened: ${{ steps.self_mutation.outputs.self_mutation_happened }}
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8000/tcp
    env:
      CI: "true"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AQUA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_DISABLE_TOOLS: "aqua:aquasecurity/trivy,grype,semgrep"
      JEST_MAX_WORKERS: "3"
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/hostedtoolcache || true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.25 # exact mise release for every workflow (#890); bump by PR
          cache: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - name: Cache agent venv
        id: cache-agent-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agent/.venv
          key: agent-venv-${{ runner.os }}-${{ hashFiles('agent/uv.lock') }}
      - name: Cache Jest transforms
        id: cache-jest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cdk/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
      - name: Cache TypeScript build info
        id: cache-tsc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cdk/tsconfig.tsbuildinfo
            cli/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('cdk/src/**', 'cdk/tsconfig.json', 'cdk/tsconfig.dev.json', 'cli/src/**', 'cli/tsconfig.json') }}
          restore-keys: |
            tsc-${{ runner.os }}-
      - name: Install dependencies
        env:
          CACHE_NODE: ${{ steps.cache-node-modules.outputs.cache-hit }}
          CACHE_VENV: ${{ steps.cache-agent-venv.outputs.cache-hit }}
          CACHE_JEST: ${{ steps.cache-jest.outputs.cache-hit }}
        run: |
          echo "::group::Cache status"
          echo "node_modules: ${CACHE_NODE:-MISS}"
          echo "agent .venv:  ${CACHE_VENV:-MISS}"
          echo "jest transforms: ${CACHE_JEST:-MISS}"
          echo "::endgroup::"
          SECONDS=0
          mise run install
          echo "::notice::Install completed in ${SECONDS}s (node_modules=${CACHE_NODE:-miss}, venv=${CACHE_VENV:-miss}, jest=${CACHE_JEST:-miss})"
      - name: Fail on lockfile drift
        shell: bash
        run: |
          drift=0
          for lock in yarn.lock agent/uv.lock; do
            git ls-files --error-unmatch "$lock" > /dev/null
            changed="$(git status --porcelain -- "$lock")"
            if [ -n "$changed" ]; then
              echo "::error file=${lock},title=Lockfile drift::${lock} is not as committed after installing dependencies. Regenerate it locally and commit it: 'mise run install' for yarn.lock (a package.json no longer matches it), 'cd agent && uv lock' for agent/uv.lock."
              git --no-pager diff --stat -- "$lock"
              drift=1
            fi
          done
          exit "$drift"
      - name: build
        id: build
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
          ABCA_DDB_LOCAL_ENDPOINT: http://127.0.0.1:${{ job.services.dynamodb.ports[8000] }}
        run: |
          # The output is copied for "Summarize build failure". pipefail is what
          # keeps the pipe to tee from turning a failed build green: do not drop it.
          set -o pipefail
          echo "::notice::Runner: $(nproc) cores, $(free -h | awk '/Mem:/{print $2}') RAM"
          SECONDS=0
          mise run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "::notice::Build completed in ${SECONDS}s ($(nproc) cores, mise parallel DAG)"
      - name: Summarize build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          log="$RUNNER_TEMP/build.log"
          esc="$(printf '\033')"
          sed -E "s/${esc}\[[0-9;]*m//g" "$log" > "$log.clean"
          # mise prints "[//pkg:task] ERROR task failed" for every task that failed.
          failed="$(sed -n -E 's/^\[([^]]+)\] ERROR task failed$/\1/p' "$log.clean" | sort -u)"
          {
            echo "## Build failed"
            if [ -z "$failed" ]; then
              echo "mise named no failed task. Last 60 lines of the build output:"
              echo '```text'
              tail -n 60 "$log.clean"
              echo '```'
            fi
            printf '%s\n' "$failed" | while IFS= read -r task; do
              [ -n "$task" ] || continue
              echo "\`mise run ${task}\` failed. Last 60 lines of its output (coverage table rows left out):"
              echo '```text'
              # Only rows of the coverage table that jest prints are left out: six
              # cells, with nothing but numbers, line ranges and dashes after the
              # first, or the "% Stmts" heading. Every other line is kept however
              # many "|" it has: compiler and type-checker errors spell union types
              # with them, and those lines are the reason the task failed.
              awk -v p="[${task}] " '
                index($0, p) != 1 { next }
                { line = substr($0, length(p) + 1); n = split(line, cell, "[|]") }
                n == 6 && (cell[2] cell[3] cell[4] cell[5] cell[6]) ~ /^[-0-9., ]+$/ { next }
                n == 6 && cell[2] ~ /^ *% Stmts *$/ { next }
                { print line }
              ' "$log.clean" | tail -n 60
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Build failed::Failed mise task(s): $(printf '%s' "${failed:-none named by mise}" | tr '\n' ' '). The job summary shows the last lines of their output."
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.compute_type }}
          path: "*/test-reports"
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cdk/coverage/lcov.info,cli/coverage/lcov.info,agent/coverage/lcov.info
          # Without disable_search the uploader also sends every file that looks like coverage,
          # e.g. contracts/coverage-thresholds.json.
          disable_search: true
          fail_ci_if_error: false
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "self_mutation_happened=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./

      - name: Upload patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true

      - name: Fail build on mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). Please run the build locally and commit the changes."
          cat repo.patch
          exit 1
