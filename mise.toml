# Root mise config: monorepo task discovery + shared tools.
# See https://mise.jdx.dev/tasks/monorepo.html
#
# Cedar engine parity contract (see docs/design/CEDAR_HITL_GATES.md §15.6,
# decision #23): both engines are pinned EXACTLY (no ^/~) and must move
# together. Golden-file parity fixtures under contracts/cedar-parity/ fail
# CI if the engines diverge on any (policy, input) pair.
#   - agent:   cedarpy==4.12.2                 (agent/pyproject.toml)
#   - cdk:     @cedar-policy/cedar-wasm@4.12.0  (cdk/package.json)
#   Both build on the Cedar 4.12.0 core.
# contracts/cedar-parity/engines/versions.json names that pair, and
# cdk/test/constructs/cedar-wasm-layer.test.ts fails when a manifest pins
# anything else.
min_version = "2026.7.11"

monorepo_root = true

[settings]
experimental = true

[tools]
node = "22"
# Gate tools are pinned to exact versions so that a required check changes only
# with a commit (#722, #540). Nothing bumps these automatically (Dependabot has
# no mise ecosystem): bump by PR to a release at least 7 days old (the cooldown
# in .github/dependabot.yml) and keep `uv` equal to agent/mise.toml.
prek = "0.5.9"
gitleaks = "8.30.1"
# uv must be declared so it is on PATH before semgrep installs: mise's
# `pipx.uvx` default routes pipx tools through `uv tool install` when uv is
# present, avoiding the classic-pipx "Failed to upgrade shared libraries" path
# that breaks under the mise 2026.6.x default `minimum_release_age`
# (jdx/mise#10279; see #320).
uv = "0.13.7"
semgrep = "1.183.0"
osv-scanner = "2.7.0"
"grype" = "0.121.1"
"aqua:zizmorcore/zizmor" = "1.32.0"

[monorepo]
config_roots = ["cdk", "agent", "cli", "docs", "web"]

##################
###### CORE ######
##################

# One `yarn install` at the repo root installs every Yarn workspace (`cdk`, `cli`, `docs`).
# `//cdk:install`, `//cli:install`, and `//docs:install` are thin wrappers around the same command.
[tasks.install]
description = "Yarn workspaces (cdk, cli, docs) + agent Python (uv) + prek git hooks when inside a Git repo"
run = [
  "yarn install --check-files",
  "cd agent && mise run install",
  # Install prek shims only in a real checkout (skip tarballs / no-.git environments).
  "bash -c 'git rev-parse --git-dir >/dev/null 2>&1 || exit 0; prek install --prepare-hooks'",
]

# Dependency upgrades for the scheduled upgrade-main workflow (and local use).
# Upgrades stay WITHIN the ranges/pins declared in each manifest — no
# range-widening flags (e.g. `yarn upgrade --latest`) — so exact pins are never
# rewritten. This is what keeps the Cedar engine parity contract intact:
# cedarpy (agent/pyproject.toml) and @cedar-policy/cedar-wasm (cdk/package.json)
# are exact pins that must only ever move together, by hand, with refreshed
# contracts/cedar-parity/ fixtures (CEDAR_HITL_GATES.md §15.6, decision #23).
[tasks.upgrade]
description = "Upgrade dependencies within declared ranges: yarn workspaces (cdk, cli, docs) + agent uv lockfile. Exact pins (incl. Cedar parity) are not rewritten."
run = [
  # Regenerate the lockfile rather than `yarn upgrade`: Yarn 1 has a known bug
  # where `yarn upgrade` copies `resolutions` entries into `dependencies` in
  # package.json. A fresh resolve upgrades within declared ranges (and honors
  # resolutions) without mutating any manifest.
  "rm -f yarn.lock && yarn install",
  "cd agent && mise run upgrade",
]

##################
###### QUALITY ###
##################

[tasks.quality]
description = "Monorepo quality checks (agent quality, then cdk, cli, docs)"
depends = ["//agent:quality"]
run = [
  "MISE_EXPERIMENTAL=1 mise //cdk:eslint",
  "MISE_EXPERIMENTAL=1 mise //cli:eslint",
  "MISE_EXPERIMENTAL=1 mise //web:eslint",
  "MISE_EXPERIMENTAL=1 mise //docs:check",
]

# What an ABCA agent runs by default to verify lint before and after its change
# (`mise run lint`, DEFAULT_LINT_COMMAND in agent/src/post_hooks.py). Check-only
# on purpose: no `--fix` and no formatter rewrite, so a pass means the tree is
# clean as committed and a failure names the file, line and rule. Use
# `mise run quality` for the auto-fixing variant.
# The two `typecheck` tasks are the only type check that test files get (jest
# transpiles them without checking), so a type error there has to fail here too.
[tasks.lint]
description = "Non-mutating lint and type checks of every package"
depends = [
  "//agent:lint",
  "//agent:format:check",
  "//agent:typecheck",
  "//cdk:eslint:check",
  "//cdk:compile",
  "//cdk:typecheck",
  "//cli:eslint:check",
  "//cli:compile",
  "//cli:typecheck",
  "//web:eslint:check",
  "//web:typecheck",
]

# The gate scripts are gates too: a typo in one (`errors.lenght > 0`) runs fine and
# passes everything. `strict` plus the unused checks catch that class; the two
# flags after them describe what `node --experimental-strip-types`, which runs
# these scripts, can execute. The behaviour of each script is tested in
# cdk/test/scripts/*.test.ts, which //cdk:test runs in the same build.
# The compiler is named by path because the root `node_modules/.bin/tsc` link
# belongs to whichever hoisted package claimed it, not to the `typescript` these
# scripts import.
[tasks."check:scripts"]
description = "Type-check the gate scripts (scripts/*.ts) with the TypeScript they import"
run = "node node_modules/typescript/bin/tsc --noEmit --strict --noUnusedLocals --noUnusedParameters --noImplicitReturns --erasableSyntaxOnly --verbatimModuleSyntax --skipLibCheck --target es2022 --module esnext --moduleResolution bundler --types node scripts/*.ts"

[tasks."check:types-sync"]
description = "Drift check: CDK shared/types.ts ↔ cli/src/types.ts (S8) and web/src/core/api/types.ts. Fails if a public type exists in both with different shapes, if CLI exports a name CDK doesn't, or if the web mirror declares a member its canonical type lacks or exports a name that has no canonical declaration and is not listed as console-only."
run = "node --experimental-strip-types scripts/check-types-sync.ts"

[tasks."check:constants-sync"]
description = "Drift check: cross-language constants in contracts/constants.json (S9). Fails if any file under agent/src assigns a name owned by the JSON contract anything but a plain read of its contract key."
run = "node --experimental-strip-types scripts/check-constants-sync.ts"

[tasks."check:coverage-thresholds-sync"]
description = "Drift check: contracts/coverage-thresholds.json ↔ coverage settings, test scripts and mise test tasks of cdk, cli, web, agent and the Jira Forge app"
run = "node --experimental-strip-types scripts/check-coverage-thresholds-sync.ts"

[tasks."test:jira-forge-app"]
description = "Test the standalone Jira Forge app-actor proxy"
run = "npm test --prefix integrations/jira-forge-app"

[tasks."sync:abca-commands"]
description = "Generate commands stubs from .abca/commands for multiple AI assistants"
run = "node scripts/sync-abca-commands.mjs"

[tasks."check:deadcode"]
description = "Dead-code gate (#282): knip must report nothing in the TS/JS workspaces — no unused file, dependency, export or exported type, no unlisted or unresolved import. Zero tolerance, no baseline."
run = '''
yarn -s knip --no-progress && exit 0
echo 'check:deadcode: knip must report nothing (zero tolerance, no baseline). For each finding above: remove the unused file, dependency or code; drop `export` if the symbol is used only in its own file; declare a use that knip cannot see in knip.json. Decide per symbol and do not bulk-apply `knip --fix`.' >&2
exit 1
'''

[tasks."check:transitive-pin-sync"]
description = "Transitive-pin sync guard (#712): fail if a package pinned in root `resolutions` resolves below that floor in integrations/jira-forge-app's npm lockfile — the standalone project root `resolutions` can't reach."
run = "node scripts/check-transitive-pin-sync.mjs"

# The five generic hooks of .pre-commit-config.yaml over every tracked file. A commit
# made without the hooks could otherwise bring an unparseable YAML or JSON file or
# leftover conflict markers through the build.
# One prek call per hook: given several ids, prek only warns about an id that matches
# no hook and exits 0; given one, it fails. SKIP is unset because prek honours it and
# reports a skipped hook as success.
# The first two hooks fix what they find and fail when they did: keep the change and
# run again.
# `mise run install` already fetches the hook repository and builds its environment
# (`prek install --prepare-hooks`), so this needs no network afterwards. Without that
# step the first run fetches from github.com and PyPI, and fails if it cannot.
[tasks."check:hygiene"]
description = "File hygiene over all tracked files (the five generic prek hooks): trailing whitespace, final newline, merge-conflict markers, YAML syntax, JSON syntax"
run = '''
unset SKIP PREK_SKIP
rc=0
for hook in trailing-whitespace end-of-file-fixer check-merge-conflict check-yaml check-json; do
  prek run --all-files "$hook" || rc=1
done
exit "$rc"
'''

[tasks."drift-prevention"]
description = "Run checks to prevent drift in contracts between packages and documentation links"
run = [
  { task = "sync:abca-commands" },
  { task = "check:hygiene" },
  { task = "check:scripts" },
  { task = "check:constants-sync" },
  { task = "check:types-sync" },
  { task = "check:coverage-thresholds-sync" },
  { task = "check:transitive-pin-sync" },
  { task = "check:deadcode" },
  { task = "//docs:link-check" },
]

[tasks."check:fast"]
description = "Fast tier: every check that needs no test run (the `lint` and `drift-prevention` tasks)"
depends = [":lint", ":drift-prevention"]

##################
#### SECURITY ####
##################

[tasks."security:secrets"]
description = "Scan the checked-out history for secrets with gitleaks (scheduled sweep + pre-push)"
# `gitleaks git` (history-aware) replaces the deprecated `gitleaks detect`
# (removed from --help in v8.19.0).
#
# Scoped to `HEAD` rather than left bare (#721, decision ratified in #723).
# Bare `gitleaks git .` walks EVERY fetched ref, so a secret in an unmerged,
# no-PR branch reddens this scan for everyone — it trains reviewers to ignore a
# red security gate, which is the worst outcome for one.
#
# `HEAD` is deliberate, and is NOT interchangeable with `main` here. HEAD is
# relative: in the scheduled CI run it resolves to `main`, but on pre-push in a
# feature worktree it also covers the commits being pushed. Pinning this to
# `main` would skip the developer's own commits — the pre-push hook would stop
# catching the secret you are about to publish.
#
# Do NOT "scope" this with a ref pattern like `--remotes=origin/main`: that
# matches no ref in a plain worktree, walks 0 commits, and silently turns the
# scan into a fail-OPEN no-op.
#
# Secrets introduced by a PR are independently caught at merge time by the
# required range-scoped check (`security:secrets:range`, see security-pr.yml).
#
# `--config .gitleaks.toml` (here and in the two tasks below) names the rule
# file instead of leaving gitleaks to look for it. When gitleaks finds no file
# it scans with its built-in rules and exits 0: the aws-account-id rule and
# every allowlist are gone and nothing says so. With the flag a missing or
# unreadable file stops the scan with an error, and a GITLEAKS_CONFIG variable
# in the environment cannot replace the rules.
#
# `--verbose` (here and in the two tasks below) prints rule, file and line for
# each finding; without it gitleaks only prints a count. `--redact` keeps the
# secret itself out of the output.
run = 'gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose --log-opts="HEAD"'

[tasks."security:secrets:range"]
description = "gitleaks over a commit range only (per-PR gate). Set GITLEAKS_RANGE, e.g. origin/main..HEAD"
# Range-scoped scan: only the commits a branch/PR introduces, not full history.
# Defaults to the full history when GITLEAKS_RANGE is unset so the task is safe
# to run anywhere. The per-PR CI job sets GITLEAKS_RANGE=origin/$BASE..HEAD.
run = 'gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose --log-opts="${GITLEAKS_RANGE:-}"'

[tasks."security:secrets:staged"]
description = "gitleaks on staged changes (pre-commit hook)"
# `gitleaks git --staged` replaces the deprecated `gitleaks protect --staged`.
run = "gitleaks git . --config .gitleaks.toml --staged --no-banner --redact --verbose"

[tasks."security:sast"]
description = "SAST scan with semgrep (auto + OWASP top 10)"
run = "semgrep scan --config auto --config p/python --config p/typescript --config p/owasp-top-ten --config p/security-audit --error --quiet ."

[tasks."security:sast:range"]
description = "Registry SAST ratcheted to newly-introduced findings only (per-PR gate). Set SEMGREP_SAST_BASELINE, e.g. origin/main."
# The rule packs of security:sast (keep the two --config lists identical), but
# --baseline-commit reports only findings a branch ADDS relative to the
# baseline. A rule the registry adds or changes therefore cannot fail code a
# pull request did not touch (#532, #540); the full scan stays in security.yml.
# Defaults the baseline to origin/main so the task is safe to run anywhere; the
# per-PR CI job sets SEMGREP_SAST_BASELINE to the PR base SHA.
#
# The packs are downloaded from semgrep.dev on every run, so the task must fail
# when they do not arrive. Semgrep exits non-zero by itself when the registry is
# unreachable or a pack cannot be loaded; there is no --quiet here because it
# hides that error. A registry that answers with EMPTY packs leaves semgrep at
# exit 0 with nothing checked, so the last command fails unless the SARIF
# report lists at least one loaded rule.
run = [
  "mkdir -p test-reports && rm -f test-reports/semgrep-sast-range.sarif",
  "semgrep scan --config auto --config p/python --config p/typescript --config p/owasp-top-ten --config p/security-audit --baseline-commit \"${SEMGREP_SAST_BASELINE:-origin/main}\" --sarif-output=test-reports/semgrep-sast-range.sarif --error .",
  '''node -e 'const sarif = JSON.parse(require("fs").readFileSync("test-reports/semgrep-sast-range.sarif", "utf8")); if (!sarif.runs[0].tool.driver.rules.length) { console.error("security:sast:range: semgrep loaded 0 rules, so nothing was checked (did semgrep.dev answer with empty rule packs?). Rerun the task; do not treat this run as a pass."); process.exit(1); }' ''',
]

[tasks."security:sast:masking"]
description = "Custom semgrep rules: silent-success masking (AI004, #257). Blocking — intentional degraded-mode fallbacks use inline justified nosemgrep on the return line."
# `semgrep test` validates the rules against their .semgrep/ fixtures first.
# The scan excludes those fixtures (they trigger by design) and writes SARIF
# to test-reports/ (gitignored) so findings stay agent-routable (CA-06).
run = [
  "semgrep test .semgrep/",
  "node scripts/check-masking-suppression-placement.mjs",
  "mkdir -p test-reports",
  "semgrep scan --config .semgrep/silent-success-masking.yaml --exclude '.semgrep/*' --sarif-output=test-reports/semgrep-silent-success-masking.sarif --error --quiet .",
]

[tasks."security:sast:masking:range"]
description = "Masking scan ratcheted to newly-introduced findings only (per-PR gate). Set SEMGREP_MASKING_BASELINE, e.g. origin/main."
# Ratchet, not a full scan: --baseline-commit reports only findings a branch
# ADDS relative to the baseline, so the pre-existing findings on main (tracked
# in #756) don't block PRs that don't touch them — while any NEW masking
# regression fails here at PR time. Mirrors security:secrets:range. The full
# blocking scan (security:sast:masking) runs next to it in the required per-PR
# job, in security.yml and in the pre-push hook.
# `semgrep test .semgrep/` runs first (as in the full task) so a PR that WEAKENS
# the rule or breaks a fixture fails at PR time too — otherwise a rule-weakening
# change would only be caught weekly / at pre-push (which is currently bypassable
# with --no-verify). Defaults the baseline to origin/main so the task is safe to
# run anywhere; the per-PR CI job sets SEMGREP_MASKING_BASELINE to the PR base SHA.
run = [
  "semgrep test .semgrep/",
  "node scripts/check-masking-suppression-placement.mjs",
  "semgrep scan --config .semgrep/silent-success-masking.yaml --exclude '.semgrep/*' --baseline-commit \"${SEMGREP_MASKING_BASELINE:-origin/main}\" --error --quiet .",
]

[tasks."security:deps"]
description = "Audit dependencies for known vulnerabilities (osv-scanner)"
# Yarn workspaces use the repo-root lockfile only; do not scan stale cli/docs yarn.lock copies.
run = "osv-scanner scan --lockfile agent/uv.lock --lockfile yarn.lock --lockfile integrations/jira-forge-app/package-lock.json"

[tasks."security:grype"]
description = "Run Grype on source files; generated/vendor dirs are excluded because lockfile, Retire, and image scans cover dependencies and runtime artifacts"
run = [
  # Dependency locks, node packages, and the built image have dedicated scans.
  # Keep this filesystem scan focused on source files, not generated/vendor output.
  "grype . --fail-on high --exclude './cdk/cdk.out/**' --exclude './node_modules/**' --exclude './**/node_modules/**' --exclude './**/.venv/**' --exclude './docs/dist/**'"
]

[tasks."security:retire"]
description = "Retire.js (CDK, CLI, docs)"
run = "npx retire --path cdk --severity high --ignore \"node_modules/**,cdk.out/**,cdk/cdk.out/**\" && cd cli && npm run security:retire && cd ../docs && npm run security:retire"

[tasks."security:gh-actions"]
description = "Static analysis of GitHub Actions workflows (zizmor)"
# Offline: no GitHub API for online-only rules; config in .github/zizmor.yml
run = "zizmor --offline .github"

[tasks.security]
description = "Run security scans"
# Every leg is a task reference, so `mise run --continue-on-error security` (the
# weekly workflow) runs all of them and still exits non-zero when any fails. A
# nested `mise //agent:security` shell call did not get the flag: a bandit
# failure skipped the image scan. Without the flag the first failure still
# stops the run, as before.
run = [
    { task = "security:secrets" },
    { task = "security:deps" },
    { task = "security:sast" },
    { task = "security:sast:masking" },
    { task = "security:grype" },
    { task = "security:retire" },
    { task = "security:gh-actions" },
    { task = "//agent:security" },
]

##################
##### HOOKS ######
##################

[tasks."hooks:install"]
description = "Install or refresh prek git hooks (also runs at end of `mise run install` in a Git repo)"
run = "prek install --prepare-hooks"

[tasks."hooks:run"]
description = "Run prek on all files (pre-commit then pre-push stages)"
run = [
  "prek run --all-files --stage pre-commit",
  "prek run --all-files --stage pre-push",
]

[tasks."hooks:pre-push:security"]
description = "Pre-push security scans"
run = "mise run security"

[tasks."hooks:pre-push:tests"]
description = "Pre-push tests in cdk/cli/agent"
run = [
  "MISE_EXPERIMENTAL=1 mise //cdk:test",
  "MISE_EXPERIMENTAL=1 mise //cli:test",
  "MISE_EXPERIMENTAL=1 mise //web:test",
  "cd agent && mise run test",
]

[tasks."hooks:pre-push"]
description = "Pre-push gate: security scans then tests in cdk/cli/agent"
run = [
  "mise run hooks:pre-push:security",
  "mise run hooks:pre-push:tests",
]

##################
##### BUILD #####
##################

# All packages run in parallel via DAG. Each resolves its own internal dependencies.
# Agent quality runs alongside CDK/CLI/docs — no sequential bottleneck.
[tasks.build]
description = "Monorepo build (agent, cdk, cli, web, docs in parallel)"
depends = [
  "//agent:quality",
  "//cdk:build",
  "//cli:build",
  "//web:build",
  "//docs:build",
  ":test:jira-forge-app",
  ":drift-prevention"
]

[tasks.default]
description = "Install + build"
depends = [":install", ":build"]
