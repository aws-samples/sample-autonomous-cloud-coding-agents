default_install_hook_types: [pre-commit, pre-push]
fail_fast: false
exclude: ^\.threat-composer/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (cdk/cdk\.out/|node_modules/|^docs/src/content/docs/.*\.md$|(^|/)LICENSE$|(^|/)\.gitattributes$|(^|/)\.npmignore$|(^|/)\.gitignore$|^cli/header\.js$|^docs/astro\.config\.mjs$|^docs/tsconfig\.json$|^docs/src/content\.config\.ts$|\.(snap|lock)$)
      - id: end-of-file-fixer
        exclude: (cdk/cdk\.out/|node_modules/|^docs/src/content/docs/.*\.md$|(^|/)LICENSE$|(^|/)\.gitattributes$|(^|/)\.npmignore$|(^|/)\.gitignore$|^cli/header\.js$|^docs/astro\.config\.mjs$|^docs/tsconfig\.json$|^docs/src/content\.config\.ts$)
      - id: check-merge-conflict
        # Without this the hook only looks while a merge is in progress.
        args: [--assume-in-merge]
      - id: check-yaml
        exclude: ^(cdk/cdk\.out/|cdk\.out/|node_modules/|agent/\.venv/)
      - id: check-json
        exclude: ^(cdk/cdk\.out/|node_modules/)

  - repo: local
    hooks:
      # On macOS the login shell of an entry puts /usr/local/bin and /opt/homebrew/bin back in front of
      # the directories mise added to PATH. With MISE_ACTIVATE_AGGRESSIVE=1 mise puts its tools first again.
      - id: gitleaks
        name: gitleaks (staged)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run security:secrets:staged'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cdk-eslint
        name: eslint (cdk)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //cdk:eslint'
        language: system
        pass_filenames: false
        files: ^cdk/.*\.(ts|tsx|mts|cts|cjs|mjs|js)$
        exclude: ^cdk/cdk\.out/
        stages: [pre-commit]

      - id: cli-eslint
        name: eslint (cli)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //cli:eslint'
        language: system
        pass_filenames: false
        files: ^cli/.*\.(ts|tsx|mts|cts|cjs|mjs|js)$
        stages: [pre-commit]

      - id: web-eslint
        name: eslint (web)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //web:eslint'
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx|mts|cts|cjs|mjs|js)$
        stages: [pre-commit]

      - id: cdk-typecheck
        name: type check (cdk)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //cdk:typecheck'
        language: system
        pass_filenames: false
        files: ^cdk/.*\.(ts|tsx|mts|cts)$
        exclude: ^cdk/cdk\.out/
        stages: [pre-commit]

      - id: cli-typecheck
        name: type check (cli)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //cli:typecheck'
        language: system
        pass_filenames: false
        files: ^cli/.*\.(ts|tsx|mts|cts)$
        stages: [pre-commit]

      - id: web-typecheck
        name: type check (web)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //web:typecheck'
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx|mts|cts)$
        stages: [pre-commit]

      - id: agent-quality
        name: quality (agent)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)/agent" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run quality'
        language: system
        pass_filenames: false
        files: ^agent/.*\.py$
        stages: [pre-commit]

      - id: shellcheck
        name: shellcheck (shell scripts)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run check:shell'
        language: system
        pass_filenames: false
        files: \.sh$
        stages: [pre-commit]

      - id: docs-sync
        name: sync docs → Starlight mirrors
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //docs:sync && git add docs/src/content/docs/'
        language: system
        pass_filenames: false
        files: ^(docs/(design|guides)/.*\.md$|CONTRIBUTING\.md$)
        stages: [pre-commit]

      - id: docs-astro-check
        name: astro check (docs)
        # astro refuses to start on a Node older than the one it declares. A login shell can put another
        # node ahead of the one docs/mise.toml names, also inside `mise exec` and mise tasks.
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)/docs" && node_bin="$(mise which node)" && PATH="$(dirname "$node_bin"):$PATH" ./node_modules/.bin/astro check'
        language: system
        pass_filenames: false
        files: ^docs/
        exclude: ^docs/node_modules/
        stages: [pre-commit]

      - id: docs-markdown-lint
        name: markdown structure lint (all tracked Markdown)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //docs:markdown-lint'
        language: system
        pass_filenames: false
        files: \.(md|mdx)$
        stages: [pre-commit]

      - id: docs-script-tests
        name: docs script tests (generator, markdown lint)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise //docs:test'
        language: system
        pass_filenames: false
        files: ^docs/scripts/
        stages: [pre-commit]

      - id: types-sync-cdk-cli
        name: type sync drift (CDK ↔ CLI ↔ web)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run check:types-sync'
        language: system
        pass_filenames: false
        files: ^(cdk/src/.*\.ts$|cli/src/types\.ts$|web/src/core/api/types\.ts$|contracts/constants\.json$|scripts/check-types-sync\.ts$)
        stages: [pre-commit]

      - id: constants-sync
        name: cross-language constants drift (contracts/constants.json)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run check:constants-sync'
        language: system
        pass_filenames: false
        files: ^(contracts/constants\.json$|agent/src/.*\.py$|agent/tests/test_constants_parity\.py$|cdk/src/handlers/shared/types\.ts$|cdk/src/constructs/(blueprint|lambda-microvm-compute)\.ts$|scripts/check-constants-sync\.ts$)
        stages: [pre-commit]

      - id: coverage-thresholds-sync
        name: coverage threshold drift (contracts/coverage-thresholds.json)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run check:coverage-thresholds-sync'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: monorepo-security-pre-push
        name: security scans (pre-push)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run hooks:pre-push:security'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: monorepo-tests-pre-push
        name: package tests (pre-push)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export TMPDIR="${HOME}/.cache/cdk-tmp" && mkdir -p "$TMPDIR" && export MISE_ACTIVATE_AGGRESSIVE=1 && mise run hooks:pre-push:tests'
        language: system
        pass_filenames: false
        stages: [pre-push]
