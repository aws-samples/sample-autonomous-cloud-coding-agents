# Git hooks via https://github.com/j178/prek (installed by `mise run install` in a Git checkout; re-run `mise run hooks:install` after edits).
# Config format matches pre-commit; run hooks with `prek` from mise (`mise.toml` [tools]).

default_install_hook_types: [pre-commit, pre-push]
fail_fast: false
exclude: ^\.threat-composer/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Skip generated trees and paths often checked in read-only (0444); mutating hooks must not touch them.
        exclude: (cdk/cdk\.out/|node_modules/|^docs/src/content/docs/.*\.md$|(^|/)LICENSE$|(^|/)\.gitattributes$|(^|/)\.npmignore$|(^|/)\.gitignore$|^cli/header\.js$|^docs/astro\.config\.mjs$|^docs/tsconfig\.json$|^docs/src/content\.config\.ts$|\.(snap|lock)$)
      - id: end-of-file-fixer
        exclude: (cdk/cdk\.out/|node_modules/|^docs/src/content/docs/.*\.md$|(^|/)LICENSE$|(^|/)\.gitattributes$|(^|/)\.npmignore$|(^|/)\.gitignore$|^cli/header\.js$|^docs/astro\.config\.mjs$|^docs/tsconfig\.json$|^docs/src/content\.config\.ts$)
      - id: check-merge-conflict
        # Without this the hook only looks while a merge is in progress: it would
        # check nothing in `mise run check:hygiene`, which runs it over all files.
        args: [--assume-in-merge]
      - id: check-yaml
        exclude: ^(cdk/cdk\.out/|cdk\.out/|node_modules/|agent/\.venv/)
      - id: check-json
        exclude: ^(cdk/cdk\.out/|node_modules/)

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && mise run security:secrets:staged'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: cdk-eslint
        name: eslint (cdk)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_EXPERIMENTAL=1 && mise //cdk:eslint'
        language: system
        pass_filenames: false
        files: ^cdk/.*\.(ts|tsx|mts|cts|cjs|mjs|js)$
        exclude: ^cdk/cdk\.out/
        stages: [pre-commit]

      - id: cli-eslint
        name: eslint (cli)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_EXPERIMENTAL=1 && mise //cli:eslint'
        language: system
        pass_filenames: false
        files: ^cli/.*\.(ts|tsx|mts|cts|cjs|mjs|js)$
        stages: [pre-commit]

      - id: web-eslint
        name: eslint (web)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_EXPERIMENTAL=1 && mise //web:eslint'
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx|mts|cts|cjs|mjs|js)$
        stages: [pre-commit]

      - id: agent-quality
        name: quality (agent)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)/agent" && mise run quality'
        language: system
        pass_filenames: false
        files: ^agent/.*\.py$
        stages: [pre-commit]

      - id: docs-sync
        name: sync docs → Starlight mirrors
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)/docs" && node scripts/sync-starlight.mjs && git add src/content/docs/'
        language: system
        pass_filenames: false
        files: ^(docs/(design|guides)/.*\.md$|CONTRIBUTING\.md$)
        stages: [pre-commit]

      - id: docs-astro-check
        name: astro check (docs)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)/docs" && ./node_modules/.bin/astro check'
        language: system
        pass_filenames: false
        files: ^docs/
        exclude: ^docs/node_modules/
        stages: [pre-commit]

      - id: docs-markdown-lint
        name: markdown structure lint (all tracked Markdown)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_EXPERIMENTAL=1 && mise //docs:markdown-lint'
        language: system
        pass_filenames: false
        files: \.(md|mdx)$|(^|/)\.markdownlint
        stages: [pre-commit]

      - id: docs-script-tests
        name: docs script tests (generator, markdown lint, lint configuration)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export MISE_EXPERIMENTAL=1 && mise //docs:test'
        language: system
        pass_filenames: false
        files: ^docs/(scripts/|\.markdownlint)
        stages: [pre-commit]

      - id: types-sync-cdk-cli
        name: type sync drift (CDK ↔ CLI ↔ web)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && mise run check:types-sync'
        language: system
        pass_filenames: false
        # The script compiles the CDK types file with every module it imports (ten
        # today, in handlers/shared and constructs), so any CDK source file may be
        # one of its inputs; plus the two mirrors and the constants they share.
        files: ^(cdk/src/.*\.ts$|cli/src/types\.ts$|web/src/core/api/types\.ts$|contracts/constants\.json$|scripts/check-types-sync\.ts$)
        stages: [pre-commit]

      - id: constants-sync
        name: cross-language constants drift (contracts/constants.json)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && mise run check:constants-sync'
        language: system
        pass_filenames: false
        # The script scans every Python file under agent/src, one CDK consumer and
        # the agent's value-parity test.
        files: ^(contracts/constants\.json$|agent/src/.*\.py$|agent/tests/test_constants_parity\.py$|cdk/src/handlers/shared/types\.ts$|cdk/src/constructs/(blueprint|lambda-microvm-compute)\.ts$|scripts/check-constants-sync\.ts$)
        stages: [pre-commit]

      - id: coverage-thresholds-sync
        name: coverage threshold drift (contracts/coverage-thresholds.json)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && mise run check:coverage-thresholds-sync'
        language: system
        pass_filenames: false
        # Every commit, not a `files` pattern: the script reads the contract, five
        # mise.toml files, four package.json files, the vitest config, the agent
        # settings and the Forge sources, and refuses rc files by name next to those
        # manifests. A pattern over that list went stale each time the script grew;
        # the check takes about a second.
        always_run: true
        stages: [pre-commit]

      - id: monorepo-security-pre-push
        name: security scans (pre-push)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && mise run hooks:pre-push:security'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: monorepo-tests-pre-push
        name: package tests (pre-push)
        entry: bash -lc 'cd "$(git rev-parse --show-toplevel)" && export TMPDIR="${HOME}/.cache/cdk-tmp" && mkdir -p "$TMPDIR" && mise run hooks:pre-push:tests'
        language: system
        pass_filenames: false
        stages: [pre-push]
