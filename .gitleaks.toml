title = "sample-autonomous-cloud-coding-agents"

[extend]
useDefault = true

[[allowlists]]
description = "PEM-shaped fixtures for output_scanner / hook tests (not real keys)."
targetRules = ["private-key"]
paths = [
    "^agent/tests/test_hooks\\.py$",
    "^agent/tests/test_output_scanner\\.py$",
]

[[allowlists]]
description = "Mock workload access token in CDK handler tests (not a real credential)."
stopwords = ["wat-opaque-123"]

[[allowlists]]
description = "Test fixture signing secret in Slack verification unit test (not a real credential)."
stopwords = ["test-signing-secret-abc123"]

[[allowlists]]
# Test idempotency-key fixture in orchestration tests (not a real credential).
# Suppressed by stopword rather than a .gitleaksignore commit-SHA fingerprint:
# the finding lives in history and SHA fingerprints break whenever history is
# rewritten (rebases / dep-bump merges), which is exactly how #530's baseline
# regressed. A stopword is SHA-independent. See #537 (regression of #530).
description = "Test idempotency-key fixture 'orch_abc_SUB-1' (not a real credential)."
stopwords = ["orch_abc_SUB-1"]

# Catch bare 12-digit AWS account IDs. The default ruleset does not flag these,
# which is how a real account ID reached a committed comment in the #236 integ
# work. RE2 (Go) has no lookarounds, so the non-digit neighbours are captured in
# non-capturing groups; the account ID itself is group 1.
[[rules]]
id = "aws-account-id"
description = "AWS account ID (12-digit, bare or in ARN/role context)"
regex = '''(?:^|[^0-9])([0-9]{12})(?:[^0-9]|$)'''
# Report/redact capture group 1 (the bare 12-digit ID) rather than the whole
# match, which would include the non-digit delimiter neighbours.
secretGroup = 1
keywords = [
    "account",
    "aws",
    "arn:aws",
    "iam::",
    "role/",
    "assumed-role",
    "AWS_ACCOUNT",
    "AccountId",
    "account_id",
]

[[rules.allowlists]]
description = "AWS-published placeholder IDs, localstack default, and lockfiles/snapshots."
regexes = [
    '''123456789012''',
    '''000000000000''',
    '''111122223333''',
    '''444455556666''',
]
paths = [
    '''(.*/)?test/.*\.snapshot/.*''',
    '''(.*/)?CHANGELOG\.md$''',
    '''(.*/)?yarn\.lock$''',
    '''(.*/)?package-lock\.json$''',
    '''(.*/)?uv\.lock$''',
]
# Per-line opt-out: append `# gitleaks:allow account-id` on a legitimate line.
stopwords = ["gitleaks:allow account-id"]

[[rules.allowlists]]
# Retired fixture value from PR #733 (#645), kept suppressed SHA-INDEPENDENTLY.
#
# `agent/tests/test_server.py` briefly used `999988887777` as the "foreign
# account" in the ARN-pinning tests. HEAD uses the AWS-published placeholder
# `111122223333` instead, but the original value survives in the already-pushed
# `baa365fc` blob, and the per-PR gate scans a COMMIT RANGE
# (`security-pr.yml` -> `security:secrets:range`, `PR_BASE_SHA..PR_HEAD_SHA`), so
# that blob is in scope until the branch merges.
#
# A regex here rather than only a `.gitleaksignore` fingerprint, for the reason
# `.gitleaksignore` itself records against #537: a fingerprint is keyed on the
# commit SHA, so a rebase or squash of this branch silently invalidates it and
# reddens a required security gate. This block cannot rot that way.
#
# SCOPED TO THE ONE FILE on purpose. `999988887777` is NOT an AWS-published
# placeholder (unlike the four in the block above), so allowlisting it repo-wide
# would mean a future real account that happens to match goes unflagged forever.
# Confined to this path, the exemption cannot outlive its cause.
description = "Retired foreign-account test fixture from #645; superseded by 111122223333 at HEAD."
regexes = [
    '''999988887777''',
]
paths = [
    '''(.*/)?agent/tests/test_server\.py$''',
]

[[rules.allowlists]]
# False positives where a 12-digit run is NOT an AWS account ID:
#  - GitHub Action commit-SHA pins contain digit runs (e.g. jdx/mise-action
#    `…981980618f…` matches `629881980618`).
#  - threat-composer artifacts use v4 UUIDs whose final node can be all digits
#    (e.g. `f30d02f6-9750-46ad-b710-398303478932`).
#  - Test fixtures use the RFC-4122 example UUID `…-446655440000`.
# These files contain no real account IDs; scope the exemption by path.
description = "Non-account 12-digit runs: workflow SHA pins, threat-composer UUIDs, test-fixture UUIDs."
regexTarget = "line"
paths = [
    '''^\.github/workflows/.*\.ya?ml$''',
    '''^\.threat-composer/.*\.json$''',
    '''^cdk/test/.*\.test\.ts$''',
]
