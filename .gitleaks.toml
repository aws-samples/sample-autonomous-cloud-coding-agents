title = "sample-autonomous-cloud-coding-agents"

[extend]
useDefault = true

[[allowlists]]
description = "PEM-shaped fixtures for output_scanner / hook tests (not real keys)."
targetRules = ["private-key"]
paths = [
    "^agent/tests/test_hooks\\.py$",
    "^agent/tests/test_output_scanner\\.py$",
]

[[allowlists]]
description = "Test fixture signing secret in Slack verification unit test (not a real credential)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
    "^cdk/test/handlers/shared/slack-verify\\.test\\.ts$",
]
stopwords = ["test-signing-secret-abc123"]

[[allowlists]]
description = "Test idempotency-key fixture 'orch_abc_SUB-1' (not a real credential)."
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
    "^cdk/test/handlers/shared/orchestration-release\\.test\\.ts$",
]
stopwords = ["orch_abc_SUB-1"]

# RE2 has no lookarounds: the non-digit neighbours are in non-capturing groups, the account ID is group 1.
[[rules]]
id = "aws-account-id"
description = "AWS account ID (12-digit, bare or in ARN/role context)"
regex = '''(?:^|[^0-9])([0-9]{12})(?:[^0-9]|$)'''
secretGroup = 1
keywords = [
    "account",
    "aws",
    "arn:aws",
    "iam::",
    "role/",
    "assumed-role",
    "AWS_ACCOUNT",
    "AccountId",
    "account_id",
]

[[rules.allowlists]]
description = "AWS-published placeholder IDs, localstack default, and lockfiles."
regexes = [
    '''123456789012''',
    '''000000000000''',
    '''111122223333''',
    '''444455556666''',
]
paths = [
    '''(.*/)?CHANGELOG\.md$''',
    '''(.*/)?yarn\.lock$''',
    '''(.*/)?package-lock\.json$''',
    '''(.*/)?uv\.lock$''',
]
# Per-line opt-out for a 12-digit number that is not an account id: end the
# line with a comment `gitleaks:allow -- <reason>`. Use it only on a line that
# holds no identifier, key or token: the marker is built into gitleaks and
# exempts the whole line from every rule, not only from this one.

[[rules.allowlists]]
description = "Retired foreign-account fixture value from #645, quoted in .gitleaksignore history."
condition = "AND"
regexes = [
    '''999988887777''',
]
paths = [
    '''^\.gitleaksignore$''',
]

[[rules.allowlists]]
description = "Workflow files: 12-digit runs inside action commit-SHA pins."
condition = "AND"
regexTarget = "line"
regexes = [
    '''uses:\s*\S+@[0-9a-f]{40}''',
]
paths = [
    '''^\.github/workflows/.*\.ya?ml$''',
]

[[rules.allowlists]]
description = "threat-composer artifacts: UUIDs and embedded base64 images."
paths = [
    '''^\.threat-composer/.*\.json$''',
]

[[rules.allowlists]]
description = "CDK tests: UUID fixtures whose final node is all digits."
condition = "AND"
regexTarget = "line"
regexes = [
    '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9]{12}''',
]
paths = [
    '''^cdk/test/.*\.test\.ts$''',
]

[[rules.allowlists]]
description = "CDK tests: all-nines account fixture and a GitHub deployment id fixture."
condition = "AND"
regexes = [
    '''^999999999999$''',
    '''^104550173395$''',
]
paths = [
    '''^cdk/test/.*\.test\.ts$''',
]
