min_version = "2026.7.11"

[tools]
node = "22.23.4"

# Outside the repo tree: CDK asset fingerprinting would walk a TMPDIR inside the bundled directory.
[env]
TMPDIR = "{{env.HOME}}/.cache/cdk-tmp"

[tasks.install]
description = "Install dependencies from repo root (Yarn workspaces)"
run = "cd .. && yarn install --check-files"

[tasks.compile]
description = "TypeScript compile"
run = "yarn compile"

[tasks.eslint]
description = "ESLint"
run = "../node_modules/.bin/eslint --config eslint.config.mjs --max-warnings 0 --fix src test scripts"

[tasks."eslint:check"]
description = "ESLint without --fix: reports findings and rewrites nothing"
run = "../node_modules/.bin/eslint --config eslint.config.mjs --max-warnings 0 src test scripts"

[tasks.test]
description = "Jest tests"
depends = [":compile"]
run = ["mkdir -p $TMPDIR", "yarn test"]

[tasks.testf]
description = "Focused jest run (no coverage, single worker)"
run = "yarn jest --coverage=false --runInBand"

[tasks.typecheck]
description = "Type-check src, test and scripts (tsc --noEmit); jest does not check types"
wait_for = [":compile"]
run = "yarn typecheck"

[tasks.synth]
description = "cdk synth"
depends = ["//web:bundle"]
run = ["mkdir -p $TMPDIR", "yarn synth"]

[tasks.census]
description = "Measure named CDK profiles and optionally audit synthesis stability (offline, unbundled)"
depends = [":compile"]
run = "yarn census"

[tasks."synth:quiet"]
description = "cdk synth (quiet)"
depends = [":compile", "//web:bundle"]
run = ["mkdir -p $TMPDIR", "yarn synth:quiet"]

[tasks."clean:disk"]
description = "Reclaim disk: stale cdk.out/$TMPDIR always; uv+docker prune only when free disk is low"
run = '''
rm -rf cdk.out || true
rm -rf "$TMPDIR"/* 2>/dev/null || true
MIN_FREE_GB="${MIN_FREE_GB:-25}"
FREE_GB=$(df -g / | awk 'NR==2 {print $4}')
echo "clean:disk — ${FREE_GB}G free (threshold ${MIN_FREE_GB}G)"
if [ "${FREE_GB:-999}" -lt "$MIN_FREE_GB" ]; then
  # Same engine CDK builds with (CDK_DOCKER), so Finch users prune Finch, not an idle Docker.
  ENGINE="${CDK_DOCKER:-docker}"
  echo "clean:disk — low disk, pruning uv + $ENGINE caches…"
  uv cache prune || true
  "$ENGINE" image prune -f || true
  "$ENGINE" builder prune -f || true
  df -h / | tail -1
else
  echo "clean:disk — enough free disk, skipping uv/docker prune"
fi
'''

[tasks."preflight:log-delivery"]
description = "Migrate pre-#703 pinned log-delivery resources before deploy (no-op otherwise)"
run = "node --experimental-strip-types scripts/preflight-log-delivery.ts"

[tasks.preflight]
description = "Read-only: check the account's bootstrap policy bundle against this checkout (PASS/WARN/FAIL; --json for CI)"
run = "npx tsx scripts/preflight-bootstrap.ts {{arg(name='cdkargs', var=true, required=false)}}"

[tasks.deploy]
description = "cdk deploy (pass args after --)"
depends = [":clean:disk", "//web:bundle"]
# mise forwards the arguments after `--` only to this task's own `run`, not to its `depends`.
run = [
  "npx tsx scripts/preflight-bootstrap.ts {{arg(name='cdkargs', var=true, required=false)}}",
  "node --experimental-strip-types scripts/preflight-log-delivery.ts {{arg(name='cdkargs', var=true, required=false)}}",
  "npx cdk deploy {{arg(name='cdkargs', var=true, required=false)}}",
]

# `cdk bootstrap` has no way to pass template parameters: set ComputeTypes on the CDKToolkit
# stack with the commands under "Using these policies" in docs/design/DEPLOYMENT_ROLES.md.
# --force (#701): without it, the CDK CLI does not overwrite a CDKToolkit stack whose
# BootstrapVariant parameter differs from the template's. It warns, changes nothing and exits 0.
[tasks.bootstrap]
description = "Bootstrap CDK with least-privilege policies, replacing an existing bootstrap (ComputeTypes=agentcore; for ECS set the ComputeTypes CFN param on CDKToolkit — see comment above the task)"
depends = [":install", ":bootstrap:generate"]
run = "npx cdk bootstrap --force --template bootstrap/bootstrap-template.yaml {{arg(name='cdkargs', var=true, required=false)}}"

[tasks."bootstrap:generate"]
description = "Regenerate all bootstrap artifacts (policies JSON, template YAML, version/hash files)"
depends = [":install"]
run = "npx tsx scripts/generate-bootstrap-artifacts.ts && npx tsx scripts/generate-bootstrap-template.ts"

[tasks.destroy]
description = "cdk destroy"
run = "npx cdk destroy"

[tasks.diff]
description = "cdk diff (pass args after --)"
depends = ["//web:bundle"]
run = "npx cdk diff {{arg(name='cdkargs', var=true, required=false)}}"

[tasks.bundle]
description = "No-op bundle step for cdk/cdk.json (NodejsFunction bundles at synth time)"
run = "node -e \"process.exit(0)\""

[tasks.build]
description = "compile, test, eslint, typecheck, synth (quiet) — DAG: compile first, then test+typecheck+synth; eslint beside them"
depends = [":test", ":eslint", ":typecheck", ":synth:quiet"]
