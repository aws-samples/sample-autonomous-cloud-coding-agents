min_version = "2026.7.11"

[tools]
node = "22"

[tasks.install]
description = "Install from monorepo root (Yarn workspaces)"
run = "cd .. && yarn install --check-files"

[tasks."dev:mock"]
description = "Run the console locally against the in-browser mock API (no AWS needed); http://127.0.0.1:5173"
run = "yarn dev:mock"

[tasks."dev:live"]
description = "Run the console locally against your deployed API and sign-in (needs AWS_PROFILE/AWS_REGION); http://localhost:5173"
run = ["node scripts/fetch-live-config.mjs", "yarn vite"]

[tasks.typecheck]
description = "Type-check the console"
# The package script, not `yarn tsc`: a script runs this package's own TypeScript, while
# `yarn tsc` runs the root node_modules/.bin/tsc, which Yarn can link to another package's copy.
run = "yarn typecheck"

[tasks.test]
description = "Run Vitest component and unit tests (coverage floors enforced)"
# The package's test script, which contracts/coverage-thresholds.json pins verbatim:
#   --coverage               without it vitest collects nothing and applies no floor
#   --config vite.config.ts  the one config file; a vitest.config.* next to it would otherwise be read instead
#   --allowOnly=false        a committed `.only` fails the run; vitest allows it by default wherever CI is not set
# For one file while iterating: `yarn vitest run test/<file>` (no coverage, no floors).
run = "yarn test"

[tasks.eslint]
description = "Run ESLint with --fix"
run = "../node_modules/.bin/eslint --max-warnings 0 --fix src test"

# The same command without --fix, for checks that must not rewrite files (the root
# `lint` task). Keep the targets of the two tasks identical. --max-warnings 0 in both:
# a warning fails the task like an error.
[tasks."eslint:check"]
description = "Run ESLint without --fix: reports findings and rewrites nothing"
run = "../node_modules/.bin/eslint --max-warnings 0 src test"

[tasks.bundle]
description = "Production bundle into web/dist (mock code is compiled out)"
run = "yarn vite build"

[tasks.build]
description = "Type-check, test, lint and bundle the console"
# `:bundle` is a dependency, not a second `yarn vite build` here: //cdk:synth
# depends on the same task and packages web/dist, so one build must write it.
depends = [":typecheck", ":test", ":eslint", ":bundle"]
